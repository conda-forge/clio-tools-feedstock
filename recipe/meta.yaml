{% set name = "clio-tools" %}
{% set version = "2026.03.30" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/modelblocks-org/clio-tools/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 9d91dbf67302849ec051ec8dcc741a66aaf78fc0e8d66b68a94871436c548bb5

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed --no-cache-dir
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - networkx >=3.4.2
    - numpy >=2.2.3
    - pandas >=2.2.3
    - pandera >=0.22.1
    - pydantic >=2.10.6
    - pydot >=3.0.4
    - pyyaml >=6.0.2

test:
  imports:
    - clio_tools
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - python {{ python_min }}
  commands:
    - pytest -vv
    - pip check

about:
  home: https://callio.pe
  summary: 'Tools and utilities for clio components'
  description: |
    Clio-tools contains a collection of utility functions that will be used across modelblocks components.
    These components may be Python software tools or snakemake data workflows.
  license: MIT
  license_file: LICENSE
  doc_url: https://clio.readthedocs.io/
  dev_url: https://github.com/modelblocks-org/clio-tools

extra:
  recipe-maintainers:
    - brynpickering
    - irm-codebase
